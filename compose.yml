services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: automatch
      POSTGRES_PASSWORD: automatch
      POSTGRES_DB: automatch
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automatch -d automatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://automatch:automatch@postgres:5432/automatch?sslmode=disable
      JWT_SECRET: dev-secret-change-me
      PORT: "8080"
    ports:
      - "8080:8080"

volumes:
  pgdata:
